services:
  db:
    image: postgres:16-alpine
    container_name: ai_tutor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_tutor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_tutor"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai_tutor_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/ai_tutor
      CANVAS_BASE_URL: ${CANVAS_BASE_URL:-https://classroom.sdi.edu}
      CANVAS_ACCESS_TOKEN: ${CANVAS_ACCESS_TOKEN:-mock-dev-token}
      CANVAS_USE_FAKE_COURSE_DATA: ${CANVAS_USE_FAKE_COURSE_DATA:-true}
      DEMO_STUDENT_ID: ${DEMO_STUDENT_ID:-}
      DEMO_INSTRUCTOR_ID: ${DEMO_INSTRUCTOR_ID:-}
      DEMO_TA_ID: ${DEMO_TA_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      STUDENT_MODEL: ${STUDENT_MODEL:-gemini-3.8-flash}
      INSTRUCTOR_MODEL: ${INSTRUCTOR_MODEL:-gemini-3.8-flash}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-gemini-3.8-flash}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_INVITED_EMAILS: ${DEMO_INVITED_EMAILS:-}
    ports:
      - "${API_PORT:-3001}:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai_tutor_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  # Cloudflare Tunnel service for public demo sharing (critique §4.3, plan Phase 5)
  # Run with: docker compose --profile tunnel up
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ai_tutor_tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
