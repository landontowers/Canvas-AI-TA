services:
  db:
    image: postgres:16-alpine
    container_name: virtual_ta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: virtual_ta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d virtual_ta"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: virtual_ta_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/virtual_ta
      PERSISTENCE_MODE: ${PERSISTENCE_MODE:-postgres}
      CANVAS_BASE_URL: ${CANVAS_BASE_URL:-https://classroom.sdi.edu}
      CANVAS_ACCESS_TOKEN: ${CANVAS_ACCESS_TOKEN:-mock-dev-token}
      CANVAS_USE_FAKE_COURSE_DATA: ${CANVAS_USE_FAKE_COURSE_DATA:-true}
      DEMO_STUDENT_ID: ${DEMO_STUDENT_ID:-}
      DEMO_INSTRUCTOR_ID: ${DEMO_INSTRUCTOR_ID:-}
      DEMO_TA_ID: ${DEMO_TA_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      STUDENT_MODEL: ${STUDENT_MODEL:-gemini-3.6-flash}
      INSTRUCTOR_MODEL: ${INSTRUCTOR_MODEL:-gemini-3.6-flash}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-gemini-3.1-flash-lite}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_INVITED_EMAILS: ${DEMO_INVITED_EMAILS:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      TELEMETRY_SALT: ${TELEMETRY_SALT:-}
      CRISIS_ALERT_WEBHOOK_URL: ${CRISIS_ALERT_WEBHOOK_URL:-}
      CRISIS_ALERT_BEARER_TOKEN: ${CRISIS_ALERT_BEARER_TOKEN:-}
      AZURE_LOG_STORAGE_ENABLED: ${AZURE_LOG_STORAGE_ENABLED:-false}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_LOG_CONTAINER_URL: ${AZURE_STORAGE_LOG_CONTAINER_URL:-}
      AZURE_STORAGE_LOG_CONTAINER: ${AZURE_STORAGE_LOG_CONTAINER:-telemetry-logs}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3000"
    volumes:
      - ./secrets:/run/secrets:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: virtual_ta_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  # Cloudflare Tunnel service for public demo sharing (critique §4.3, plan Phase 5)
  # Run with: docker compose --profile tunnel up
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: virtual_ta_tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
