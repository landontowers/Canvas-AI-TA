services:
  db:
    image: postgres:16-alpine
    container_name: ai_tutor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_tutor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_tutor"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai_tutor_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/ai_tutor
      CANVAS_BASE_URL: ${CANVAS_BASE_URL:-https://classroom.sdi.edu}
      CANVAS_ACCESS_TOKEN: ${CANVAS_ACCESS_TOKEN:-mock-dev-token}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
    ports:
      - "${API_PORT:-3001}:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai_tutor_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
